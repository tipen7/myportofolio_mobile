include: package:very_good_analysis/analysis_options.yaml

analyzer:
  errors:
    # Flutter > 3.47 menandai material.dart/cupertino.dart sebagai deprecated;
    # migrasi ke material_ui/cupertino_ui belum termasuk tutorial ini.
    deprecated_member_use: ignore
  exclude:
    - "**/*.g.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    public_member_api_docs: false
    # Sintaks konstruktor `new(...)` Dart 3.13 sengaja belum dipakai.
    unnecessary_type_name_in_constructor: false
